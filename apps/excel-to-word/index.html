
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Word Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">

        <main class="main-content">

            <section class="welcome">
                <h2>Създай своя документ</h2>
                <p>Прикачи Excel файл и Word шаблон, за да генерираш готов документ.</p>
            </section>

            <section class="upload-grid">

                <div class="upload-card">
                    <div class="file-icon excel-icon">X</div>
                    <h3>Excel файл</h3>
                    <p>Избери файл с данни (.xlsx, .xls)</p>

                    <input type="file" id="excelFile"
                           accept=".xlsx,.xls" hidden>

                    <button class="upload-button"
                            onclick="document.getElementById('excelFile').click()">
                        Избери Excel файл
                    </button>

                    <p class="file-status" id="excelStatus">
                        Няма избран файл
                    </p>
                </div>

                <div class="upload-card">
                    <div class="file-icon word-icon">W</div>
                    <h3>Word шаблон</h3>
                    <p>Избери шаблон (.docx)</p>

                    <input type="file" id="wordFile"
                           accept=".docx" hidden>

                    <button class="upload-button"
                            onclick="document.getElementById('wordFile').click()">
                        Избери Word шаблон
                    </button>

                    <p class="file-status" id="wordStatus">
                        Няма избран файл
                    </p>
                </div>

            </section>

            <section class="generate-section">
                <div class="generate-info">
                    <h3>Готов ли си?</h3>
                    <p>След избора на двата файла ще можеш да генерираш документа.</p>
                </div>

                <button id="generateButton" disabled>
                    Генерирай Word документ
                </button>

                <p id="message"></p>
            </section>

        </main>

    </div>

    <!-- Библиотека за четене на Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> 

    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js"></script>

    <script src="js/excel.js"></script>
    <script src="js/word.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
