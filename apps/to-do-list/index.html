<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>To Do List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">



</head>

<body>

<div class="container mt-5">

<div class="card shadow-sm">

<!-- HEADER -->

<div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
	<h3 class="card-title mb-0" id="listTitle" style="cursor:pointer;">
  To Do List
</h3>
</div>

<!-- TABLE -->

<div class="card-body">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <!-- SEARCH -->
    <div class="input-group" style="max-width: 250px;">
        <input id="searchInput" class="form-control form-control-sm" placeholder="Search tasks...">
        <div class="input-group-append">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
        </div>
    </div>

    <!-- FILTER BUTTONS -->
    <div class="btn-group">
        <button class="btn btn-sm btn-outline-dark active-filter" data-filter="all">
            All (<span id="c-all">0</span>)
        </button>

        <button class="btn btn-sm btn-outline-dark" data-filter="active">
            Active (<span id="c-active">0</span>)
        </button>

        <button class="btn btn-sm btn-outline-dark" data-filter="completed">
            Completed (<span id="c-completed">0</span>)
        </button>

        <button class="btn btn-sm btn-outline-dark" data-filter="overdue">
            Overdue (<span id="c-overdue">0</span>)
        </button>
    </div>

    <!-- DARK MODE -->
    <button class="btn btn-dark btn-sm" id="darkToggle">
        🌙
    </button>
    </div>

<table class="table table-hover mb-0">

<thead class="thead-light">
<tr>
<th class="sortable" data-sort="done">Done <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
<th class="sortable" data-sort="text">Task <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
<th class="sortable" data-sort="priority">Priority <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
<th class="sortable" data-sort="date">Due Date <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
<th class="sortable" data-sort="status">Status <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
<th>Actions</th>
</tr>
</thead>

<tbody id="taskTable"></tbody>
</table>

</div>

<div class="card-footer d-flex justify-content-between align-items-center">

<button class="btn btn-primary" id="addBtn">+ Add Task</button>

<div class="d-flex align-items-center">

  <button class="btn btn-sm btn-outline-secondary mr-1" id="firstPage">« First</button>
  <button class="btn btn-sm btn-outline-secondary mr-1" id="prevPage">‹ Prev</button>

  <div id="pageNumbers" class="d-flex"></div>

  <button class="btn btn-sm btn-outline-secondary ml-1" id="nextPage">Next ›</button>
  <button class="btn btn-sm btn-outline-secondary ml-1" id="lastPage">Last »</button>

</div>

</div>

</div>
</div>

<!-- MODAL -->

<div class="modal fade" id="taskModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Task</h5>
<button class="close" data-dismiss="modal">&times;</button>
</div>

<div class="modal-body">
  <input id="taskText" class="form-control mb-2" placeholder="Task">

  <select id="taskPriority" class="form-control mb-2">
    <option value="" disabled selected>Select Priority</option>
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>

  <input id="taskDate" type="date" class="form-control mb-2">
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
<button class="btn btn-primary" id="saveBtn">Save</button>
</div>

</div>
</div>
</div>

<div class="modal fade" id="deleteModal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirm delete</h5>
        <button class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body">
        Are you sure you want to delete this task?
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
<script src="js/app.js"></script>



</body>
</html>
