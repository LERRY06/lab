<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Данни за обучение</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container">
        <h1>Данни за обучение</h1>

        <p class="subtitle">
            Въведи темата и версията на обучението.
        </p>

        <form id="trainingForm">
            <label for="trainingTopic">Тема на обучение *</label>
            <input type="text" id="trainingTopic" required>

            <label for="trainingVersion">Версия *</label>
            <input type="text" id="trainingVersion" required>

            <button type="submit">Запази</button>
        </form>

        <button type="button" id="backButton">
            Назад към началното меню
        </button>

        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./js/additional-data.js"></script>
</body>

</html>
