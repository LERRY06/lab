
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Служители</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/app-common.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container">

        
<header class="page-header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1>Служители</h1>
            <p class="subtitle">Списък със записаните служители</p>
        </div>

        
<a href="add-employee.html"
   id="openEmployeesButton"
   class="app-btn app-btn--primary"
   style="display: inline-block; text-decoration: none;">
    Добави служител
</a>

    </div>
</header>


        <section id="employeeList"
                 class="employee-list"
                 aria-label="Списък със служители">
        </section>

        <p id="status" role="status" aria-live="polite"></p>

    </main>

    <script type="module" src="./js/employees.js"></script>
    

<!-- DELETE EMPLOYEE MODAL -->
<div id="deleteEmployeeModal"
     class="app-modal"
     hidden>

    <div class="app-modal-content"
         role="dialog"
         aria-modal="true"
         aria-labelledby="deleteEmployeeTitle"
         aria-describedby="deleteEmployeeMessage">

        <div class="modal-header">
            <h2 id="deleteEmployeeTitle">
                Изтриване на служител
            </h2>
        </div>

        <div class="modal-body"
             id="deleteEmployeeMessage">
            Сигурни ли сте, че искате да изтриете този служител?
        </div>

        <div class="modal-footer">

            <button type="button"
                    id="cancelDeleteEmployee"
                    class="app-btn app-btn--secondary">
                Откажи
            </button>

            <button type="button"
                    id="confirmDeleteEmployee"
                    class="app-btn app-btn--danger">
                Изтрий
            </button>

        </div>

    </div>
</div>


</body>

</html>
