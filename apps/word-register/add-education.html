
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Данни за обучение</title>
    <link rel="stylesheet" href="../../css/app-common.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container">
        <h1 id="pageTitle">Добавяне на обучение</h1>

        <p class="subtitle">
            Въведете данните за обучението.
        </p>

        
<form id="trainingForm">
    <label for="trainingTopic">Тема на обучение *</label>
    <input type="text" id="trainingTopic" required>

    <label for="trainingVersion">Версия *</label>
    <input type="text" id="trainingVersion" required>

    <div class="app-button-group">

        <button type="submit"
                id="saveTrainingButton"
                class="app-btn app-btn--primary">
            Добави обучение
        </button>

        <button type="button"
                id="cancelEditButton"
                class="app-btn app-btn--warning"
                hidden>
            Откажи редактирането
        </button>

    </div>
</form>

<button type="button"
        id="backButton"
        class="app-btn app-btn--secondary app-btn-standalone">
    Назад към списъка
</button>

<p id="status" role="status" aria-live="polite"></p>

    </main>

    <script type="module" src="./js/add-education.js"></script>
</body>

</html>
