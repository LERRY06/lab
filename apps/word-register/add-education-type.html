
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вид обучение</title>

    <link rel="stylesheet" href="../../css/app-common.css">
</head>

<body>
    <main class="container">

        <h1 id="pageTitle">Добавяне на вид обучение</h1>

        <p class="subtitle">
            Въведете вида на обучението.
        </p>

        <form id="trainingTypeForm">

            <label for="trainingType">Вид обучение *</label>
            <input
                type="text"
                id="trainingType"
                placeholder="Например: Начално, Периодично..."
                required
            >

            <div class="app-button-group">

                <button
                    type="submit"
                    id="saveTrainingTypeButton"
                    class="app-btn app-btn--primary">
                    Добави вид обучение
                </button>

                <button
                    type="button"
                    id="cancelEditButton"
                    class="app-btn app-btn--warning"
                    hidden>
                    Откажи редактирането
                </button>

            </div>

        </form>

        <button
            type="button"
            id="backButton"
            class="app-btn app-btn--secondary app-btn-standalone">
            Назад към списъка
        </button>

        <p id="status" role="status" aria-live="polite"></p>

    </main>

    <script type="module" src="./js/add-education-type.js"></script>

</body>
</html>
