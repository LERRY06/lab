
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Данни за служител</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container">
        <h1 id="pageTitle">Добавяне на служител</h1>

        <p class="subtitle">
            Въведете данните на служителя.
        </p>

        <form id="employeeForm">
            <label for="firstName">Първо име *</label>
            <input type="text" id="firstName" required>

            <label for="middleName">Презиме *</label>
            <input type="text" id="middleName" required>

            <label for="lastName">Фамилия *</label>
            <input type="text" id="lastName" required>

            <label for="companyNumber">Фирмен номер *</label>
            <input type="text" id="companyNumber" required>

            <label for="position">Длъжност *</label>
            <input type="text" id="position" required>

            <button type="submit" id="saveEmployeeButton">
                Добави служител
            </button>

            <button type="button" id="cancelEditButton" hidden>
                Откажи редактирането
            </button>
        </form>

        <button type="button" id="backButton">
            Назад към списъка
        </button>

        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./js/add-employee.js"></script>
</body>

</html>
