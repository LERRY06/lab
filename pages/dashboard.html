<div class="dashboard-container">


    <!-- MAIN MENU -->

    <section class="dashboard-section">

        <h2 class="dashboard-title">
            <i class="fa-solid fa-bars"></i>
            Main Menu
        </h2>

        <div class="dashboard-grid">

            <a href="../apps/to-do-list/index.html"
               target="contentFrame"
               class="dashboard-card">

                <div class="dashboard-icon dashboard-icon--blue">
                    <i class="fa-solid fa-list-check"></i>

                    <h3>Tasks</h3>
                    <p>Task and activity management</p>
                </div>

            </a>

        </div>

    </section>


    <!-- DOCUMENT MANAGEMENT -->

    <section class="dashboard-section">

        <h2 class="dashboard-title">

        </h2>

        <div class="dashboard-grid">

            <a href="../apps/excel-to-word/index.html"
               target="contentFrame"
               class="dashboard-card">

                <div class="dashboard-icon dashboard-icon--green">
                    <i class="fa-solid fa-file-word"></i>
                </div>

                <div class="dashboard-content">
                    <h3>Excel to Word</h3>
                    <p>Excel to Word document conversion</p>
                </div>

                <i class="fa-solid fa-chevron-right dashboard-arrow"></i>

            </a>


            <a href="../apps/word-register/dist/word-register.html"
               target="contentFrame"
               class="dashboard-card">

                <div class="dashboard-icon dashboard-icon--purple">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="dashboard-content">
                    <h3>Employee Files</h3>
                    <p>Employee records and personal files</p>
                </div>

                <i class="fa-solid fa-chevron-right dashboard-arrow"></i>

            </a>

        </div>

    </section>
